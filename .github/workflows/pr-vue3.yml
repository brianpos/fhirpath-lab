name: PR Build – Vue3 (Nuxt4)

on:
  pull_request:
    branches:
      - main
      - master
      - develop
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: Build & Deploy Vue3 PR Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'

    defaults:
      run:
        working-directory: vue3-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vue3-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        env:
          NUXT_APP_BASE_URL: /fhirpath-lab/pr-preview/vue3/pr-${{ github.event.pull_request.number }}/
        run: npm run generate

      - name: Deploy preview to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: vue3-src/.output/public/
          destination_dir: pr-preview/vue3/pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Post preview URL comment
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.pull_request.number }}
          body: |
            ## Vue3 PR Preview
            🔍 Preview deployed: https://brianpos.github.io/fhirpath-lab/pr-preview/vue3/pr-${{ github.event.pull_request.number }}/
          comment-author: github-actions[bot]
          edit-mode: replace
          body-includes: Vue3 PR Preview

  cleanup:
    name: Remove Vue3 PR Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Remove preview directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf pr-preview/vue3/pr-${{ github.event.pull_request.number }} || true
          git diff --cached --quiet || git commit -m "chore: remove Vue3 preview for PR #${{ github.event.pull_request.number }}"
          for i in 1 2 3; do
            git pull --rebase origin gh-pages && git push && break || sleep 10
          done
