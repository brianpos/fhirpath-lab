name: PR Build – Vue3 (Nuxt4)

on:
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    name: Build & Upload Vue3 Static Site
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: vue3-src

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: vue3-src/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npm run generate

      - name: Upload static site artifact
        uses: actions/upload-artifact@v4
        with:
          name: vue3-static-site-pr-${{ github.event.pull_request.number }}
          path: vue3-src/.output/public/
          if-no-files-found: error
          compression-level: 0
